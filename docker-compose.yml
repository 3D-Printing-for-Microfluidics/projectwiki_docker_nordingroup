

services:
  mongo:
    build:
      context: .
      dockerfile: mongo.dockerfile
    ports:
      - "27017:27017"
    volumes:
      - C:/Users/wwardle/Desktop/ProjectWiki/backup/2024.04.30.220222:/data/db/backup
    networks:
      - pw-network
    environment:
      MONGO_DATA_DIR: /data/db/backup

  project-wiki:
    build:
      context: .
      dockerfile: app.dockerfile
    networks:
      - pw-network
    ports:
      - "31415:31415"
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - C:/Users/wwardle/Desktop/ProjectWiki/uploads:/app/uploads
      - C:/Users/wwardle/Desktop/ProjectWiki/projectwiki_docker_nordingroup/PW_Caddyfile:/etc/caddy/PW_Caddyfile
    environment:
      MONGO_DATA_DIR: /data/db/backup
      DB_SERVICE: mongo

networks:
  pw-network:
    driver: bridge

